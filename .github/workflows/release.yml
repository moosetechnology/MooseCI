name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
  packages: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push base
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile
          push: true
          tags: |
            ghcr.io/moosetechnology/moose-ci:${{ github.ref_name }}
            ghcr.io/moosetechnology/moose-ci:latest
      - name: Build and push python
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.python
          push: true
          tags: |
            ghcr.io/moosetechnology/moose-ci:${{ github.ref_name }}-python
            ghcr.io/moosetechnology/moose-ci:python
          build-args: BASE_IMAGE=ghcr.io/moosetechnology/moose-ci:${{ github.ref_name }}
      - name: Build and push corese
        uses: docker/build-push-action@v5
        with:
          context: ./docker
          file: ./docker/Dockerfile.corese
          push: true
          tags: |
            ghcr.io/moosetechnology/moose-ci:${{ github.ref_name }}-corese
            ghcr.io/moosetechnology/moose-ci:corese
          build-args: BASE_IMAGE=ghcr.io/moosetechnology/moose-ci:${{ github.ref_name }}
      # The release may already exist: creating it on the GitHub page also pushes the tag that runs this workflow
      - name: Create release
        run: |
          if gh release view "${{ github.ref_name }}" > /dev/null 2>&1; then
            echo "Release ${{ github.ref_name }} already exists"
          else
            gh release create "${{ github.ref_name }}" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}