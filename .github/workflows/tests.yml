name: Tests

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on: [ push, pull_request ]

jobs:
  build:
    name: Moose ${{ matrix.moose }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - moose: '13'
            smalltalk: Moose64-13
          # smalltalkCI has no Moose64-14 image: download Moose 14 and run it on the Pharo 14 VM
          - moose: '14'
            smalltalk: Pharo64-14
            image-url: https://github.com/moosetechnology/Moose/releases/download/continuous/Moose14-development-Pharo64-14.zip
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'
      # VerveineJ v5.1.1 is compiled for Java 25; the runner's default Java is older
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Download VerveineJ
        run: |
          curl -fsSL -o "$RUNNER_TEMP/VerveineJ.jar" \
            https://github.com/moosetechnology/VerveineJ/releases/download/v5.1.1/VerveineJ-v5.1.1.jar
          echo "VERVEINEJ_JAR=$RUNNER_TEMP/VerveineJ.jar" >> "$GITHUB_ENV"
      # Native libraries of the Python group, built like in docker/Dockerfile.python
      - name: Build tree-sitter
        run: |
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter "$RUNNER_TEMP/tree-sitter"
          make -C "$RUNNER_TEMP/tree-sitter"
          git clone --depth 1 https://github.com/tree-sitter/tree-sitter-python "$RUNNER_TEMP/tree-sitter-python"
          make -C "$RUNNER_TEMP/tree-sitter-python"
          sudo cp "$RUNNER_TEMP/tree-sitter/libtree-sitter.so" "$RUNNER_TEMP/tree-sitter-python/libtree-sitter-python.so" /usr/lib/
      - uses: hpi-swa/setup-smalltalkCI@v1
        id: smalltalkci
        with:
          smalltalk-image: ${{ matrix.smalltalk }}
      - name: Download Moose image
        if: matrix.image-url
        run: |
          curl -fsSL -o "$RUNNER_TEMP/moose.zip" "${{ matrix.image-url }}"
          unzip -q "$RUNNER_TEMP/moose.zip" -d "$RUNNER_TEMP/moose"
          echo "MOOSE_IMAGE=$(find "$RUNNER_TEMP/moose" -name '*.image' | head -1)" >> "$GITHUB_ENV"
      - run: smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }} ${MOOSE_IMAGE:+--image "$MOOSE_IMAGE"}
        shell: bash
        timeout-minutes: 15