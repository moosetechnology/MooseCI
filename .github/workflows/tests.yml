name: Tests

env:
  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

on: [ push, pull_request ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: '0'
      - name: Download VerveineJ
        run: |
          curl -fsSL -o "$RUNNER_TEMP/VerveineJ.jar" \
            https://github.com/moosetechnology/VerveineJ/releases/download/v5.1.1/VerveineJ-v5.1.1.jar
          echo "VERVEINEJ_JAR=$RUNNER_TEMP/VerveineJ.jar" >> "$GITHUB_ENV"
      - uses: hpi-swa/setup-smalltalkCI@v1
        id: smalltalkci
        with:
          smalltalk-image: Moose64-13
      - run: smalltalkci -s ${{ steps.smalltalkci.outputs.smalltalk-image }}
        shell: bash
        timeout-minutes: 15